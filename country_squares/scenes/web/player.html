<!doctype html>
<!--
  scenes/web/player.html?scene=<SceneId>
  Hosts one scene at exactly 1080x1920 (vertical Short). The capture harness (tools/capture.py) calls
  window.setTime(t) and screenshots each frame, so every pixel is a pure function of t: no requestAnimationFrame,
  no wall clock. Add &preview=1 to play it in a normal browser.
-->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/scenes/web/style.css">
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
import { boot } from '/scenes/web/runtime.js';
boot().catch(e => { console.error('BOOT FAILED', e.stack || e); window.bootError = String(e.stack || e); });
</script>
</body>
</html>
